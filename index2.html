<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Maple Bear</title>
    <!-- Tailwind CSS CDN para estilização moderna e limpa -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 110px;
        }
    </style>
</head>
<body class="py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
        
        <!-- Cabeçalho -->
        <div class="bg-red-700 text-white py-6 px-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold tracking-wide flex items-center gap-3">
                    <i class="fa-solid fa-school-flag"></i> Relatório Maple Bear
                </h1>
                <p class="text-red-100 text-sm mt-1">Sistema de Acompanhamento Acadêmico por Anos Escolares</p>
            </div>
            <div class="text-right">
                <div class="hidden sm:block text-red-200 text-3xl mb-1">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <!-- Indicador de Status do Salvamento Automático -->
                <span id="status-salvamento" class="text-xs bg-red-800 text-red-200 px-2.5 py-1 rounded-full border border-red-600">
                    <i class="fa-solid fa-cloud"></i> Pronto para preencher
                </span>
            </div>
        </div>

        <!-- Formulário de Relatório -->
        <form id="mapleReportForm" class="p-8 space-y-8" onsubmit="event.preventDefault(); salvarRelatorioManual();">

            <!-- Cabeçalho Geral da Unidade e Data -->
            <div class="bg-red-50 border border-red-200 rounded-lg p-6 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-red-900 mb-2"><i class="fa-solid fa-building text-red-600"></i> Nome da Unidade:</label>
                    <input type="text" id="nome-unidade" placeholder="Ex: Unidade Campinas" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm bg-white" required oninput="acionarSalvamentoAutomatico()" onchange="carregarRelatorioPorUnidade()">
                </div>
                <div>
                    <label class="block text-sm font-bold text-red-900 mb-2"><i class="fa-solid fa-calendar-days text-red-600"></i> Data do Relatório:</label>
                    <input type="date" id="data-relatorio" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm bg-white" required oninput="acionarSalvamentoAutomatico()">
                </div>
            </div>

            <!-- Blocos de Year 6 ao Year 12 -->
            <div id="container-anos">
                <!-- O conteúdo dos anos será gerado via script para garantir perfeição e evitar erros de ID -->
            </div>

            <!-- Botões de Ação -->
            <div class="flex flex-wrap justify-end gap-4 pt-4 border-t">
                <button type="reset" class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition" onclick="setTimeout(limparFormularioInterface, 10)">
                    <i class="fa-solid fa-rotate-left"></i> Limpar Campos
                </button>
                <a href="relatorios2.html" class="px-6 py-2.5 rounded-lg bg-gray-800 text-white font-medium hover:bg-gray-900 shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> Ver Relatórios Salvos
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-lg bg-red-700 text-white font-medium hover:bg-red-800 shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Relatório
                </button>
            </div>

        </form>

    </div>

    <script>
        const anos = [6, 7, 8, 9, 10, 11, 12];
        let temporizadorAutoSave = null;

        // Gerador automático dos blocos de Year para garantir que todos os IDs existam corretamente no DOM
        function renderizarBlocosAnos() {
            const container = document.getElementById('container-anos');
            let html = '';
            
            anos.forEach(ano => {
                html += `
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm mb-6">
                        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                            <i class="fa-solid fa-graduation-cap text-red-600"></i> Year ${ano}
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>
                                <textarea id="obs-year${ano}" placeholder="Digite as observações detalhadas para o Year ${ano}..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm" oninput="acionarSalvamentoAutomatico()"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-solid fa-paperclip text-gray-500"></i> Evidências</label>
                                <textarea id="ev-year${ano}" placeholder="Insira links, descrições ou registros de evidências..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm" oninput="acionarSalvamentoAutomatico()"></textarea>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function obterChaveStorage(unidade) {
            return 'maple_report_' + unidade.trim().toLowerCase().replace(/\s+/g, '_');
        }

        function acionarSalvamentoAutomatico() {
            const unidade = document.getElementById('nome-unidade').value.trim();
            if (!unidade) return;

            const statusEl = document.getElementById('status-salvamento');
            statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
            statusEl.className = "text-xs bg-amber-700 text-amber-100 px-2.5 py-1 rounded-full border border-amber-600";

            clearTimeout(temporizadorAutoSave);
            temporizadorAutoSave = setTimeout(() => {
                executarSalvamento();
                statusEl.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Salvo automaticamente';
                statusEl.className = "text-xs bg-emerald-800 text-emerald-100 px-2.5 py-1 rounded-full border border-emerald-600";
            }, 800);
        }

        function executarSalvamento() {
            const unidade = document.getElementById('nome-unidade').value.trim();
            if (!unidade) return false;

            const dataRelatorio = document.getElementById('data-relatorio').value;
            const dadosRelatorio = {
                unidade: unidade,
                data: dataRelatorio,
                anos: {}
            };

            // Varredura garantida de todos os anos (6 a 12)
            anos.forEach(ano => {
                const obsEl = document.getElementById(`obs-year${ano}`);
                const evEl = document.getElementById(`ev-year${ano}`);
                
                dadosRelatorio.anos[ano] = {
                    observacoes: obsEl ? obsEl.value : '',
                    evidencias: evEl ? evEl.value : ''
                };
            });

            const chave = obterChaveStorage(unidade);
            localStorage.setItem(chave, JSON.stringify(dadosRelatorio));
            return true;
        }

        function salvarRelatorioManual() {
            const unidade = document.getElementById('nome-unidade').value.trim();
            if (!unidade) {
                alert('Por favor, informe o Nome da Unidade antes de salvar.');
                return;
            }

            executarSalvamento();
            alert(`Relatório da unidade "${unidade}" salvo com sucesso na base de dados!`);
        }

        function carregarRelatorioPorUnidade() {
            const unidade = document.getElementById('nome-unidade').value.trim();
            if (!unidade) return;

            const chave = obterChaveStorage(unidade);
            const dadosSalvos = localStorage.getItem(chave);
            const statusEl = document.getElementById('status-salvamento');

            if (dadosSalvos) {
                const dados = JSON.parse(dadosSalvos);
                document.getElementById('data-relatorio').value = dados.data || '';

                anos.forEach(ano => {
                    if (dados.anos && dados.anos[ano]) {
                        const obsEl = document.getElementById(`obs-year${ano}`);
                        const evEl = document.getElementById(`ev-year${ano}`);
                        
                        if (obsEl) obsEl.value = dados.anos[ano].observacoes || '';
                        if (evEl) evEl.value = dados.anos[ano].evidencias || '';
                    }
                });

                statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> Relatório carregado';
                statusEl.className = "text-xs bg-blue-800 text-blue-100 px-2.5 py-1 rounded-full border border-blue-600";
            } else {
                document.getElementById('data-relatorio').value = '';
                anos.forEach(ano => {
                    const obsEl = document.getElementById(`obs-year${ano}`);
                    const evEl = document.getElementById(`ev-year${ano}`);
                    
                    if (obsEl) obsEl.value = '';
                    if (evEl) evEl.value = '';
                });

                statusEl.innerHTML = '<i class="fa-solid fa-cloud"></i> Novo relatório';
                statusEl.className = "text-xs bg-red-800 text-red-200 px-2.5 py-1 rounded-full border border-red-600";
            }
        }

        function limparFormularioInterface() {
            const statusEl = document.getElementById('status-salvamento');
            statusEl.innerHTML = '<i class="fa-solid fa-cloud"></i> Formulário limpo';
            statusEl.className = "text-xs bg-red-800 text-red-200 px-2.5 py-1 rounded-full border border-red-600";
        }

        // Inicializa a renderização dos blocos assim que a página carregar
        document.addEventListener('DOMContentLoaded', () => {
            renderizarBlocosAnos();
        });
    </script>

</body>
</html>
