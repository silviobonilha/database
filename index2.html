<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Relatório Maple Bear</title>
    <!-- Tailwind CSS CDN para estilização moderna e limpa -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 110px;
        }
    </style>
</head>
<body class="py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
        
        <!-- Cabeçalho -->
        <div class="bg-red-700 text-white py-6 px-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold tracking-wide flex items-center gap-3">
                    <i class="fa-solid fa-school-flag"></i> Relatório Maple Bear
                </h1>
                <p class="text-red-100 text-sm mt-1">Sistema de Acompanhamento Acadêmico por Anos Escolares</p>
            </div>
            <div class="hidden sm:block text-red-200 text-4xl">
                <i class="fa-solid fa-book-open-reader"></i>
            </div>
        </div>

        <!-- Formulário de Relatório -->
        <form id="mapleReportForm" class="p-8 space-y-8" onsubmit="event.preventDefault(); salvarRelatorio();">

            <!-- Cabeçalho Geral da Unidade e Data -->
            <div class="bg-red-50 border border-red-200 rounded-lg p-6 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-red-900 mb-2"><i class="fa-solid fa-building text-red-600"></i> Nome da Unidade:</label>
                    <input type="text" id="nome-unidade" placeholder="Ex: Unidade Campinas" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm bg-white" required onchange="carregarRelatorioPorUnidade()">
                </div>
                <div>
                    <label class="block text-sm font-bold text-red-900 mb-2"><i class="fa-solid fa-calendar-days text-red-600"></i> Data do Relatório:</label>
                    <input type="date" id="data-relatorio" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm bg-white" required>
                </div>
            </div>

            <!-- Bloco Year 6 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                    <i class="fa-solid fa-graduation-cap text-red-600"></i> Year 6
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>
                        <textarea id="obs-year6" placeholder="Digite as observações detalhadas para o Year 6..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-solid fa-paperclip text-gray-500"></i> Evidências</label>
                        <textarea id="ev-year6" placeholder="Insira links, descrições ou registros de evidências..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- Bloco Year 7 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                    <i class="fa-solid fa-graduation-cap text-red-600"></i> Year 7
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>
                        <textarea id="obs-year7" placeholder="Digite as observações detalhadas para o Year 7..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-solid fa-paperclip text-gray-500"></i> Evidências</label>
                        <textarea id="ev-year7" placeholder="Insira links, descrições ou registros de evidências..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- Bloco Year 8 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                    <i class="fa-solid fa-graduation-cap text-red-600"></i> Year 8
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>
                        <textarea id="obs-year8" placeholder="Digite as observações detalhadas para o Year 8..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-solid fa-paperclip text-gray-500"></i> Evidências</label>
                        <textarea id="ev-year8" placeholder="Insira links, descrições ou registros de evidências..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- Bloco Year 9 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                    <i class="fa-solid fa-graduation-cap text-red-600"></i> Year 9
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>
                        <textarea id="obs-year9" placeholder="Digite as observações detalhadas para o Year 9..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-solid fa-paperclip text-gray-500"></i> Evidências</label>
                        <textarea id="ev-year9" placeholder="Insira links, descrições ou registros de evidências..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- Bloco Year 10 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                    <i class="fa-solid fa-graduation-cap text-red-600"></i> Year 10
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>

            </div>

            <!-- Bloco Year 11 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                    <i class="fa-solid fa-graduation-cap text-red-600"></i> Year 11
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>
                        <textarea id="obs-year11" placeholder="Digite as observações detalhadas para o Year 11..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>

                    </div>
                </div>
            </div>

            <!-- Bloco Year 12 -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-6 shadow-sm">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2 border-b pb-3 mb-4">
                    <i class="fa-solid fa-graduation-cap text-red-600"></i> Year 12
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-regular fa-comment-dots text-gray-500"></i> Observações</label>
                        <textarea id="obs-year12" placeholder="Digite as observações detalhadas para o Year 12..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1"><i class="fa-solid fa-paperclip text-gray-500"></i> Evidências</label>
                        <textarea id="ev-year12" placeholder="Insira links, descrições ou registros de evidências..." class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="flex flex-wrap justify-end gap-4 pt-4 border-t">
                <button type="reset" class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition">
                    <i class="fa-solid fa-rotate-left"></i> Limpar Campos
                </button>
                <a href="relatorios.html" class="px-6 py-2.5 rounded-lg bg-gray-800 text-white font-medium hover:bg-gray-900 shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> Ver Relatórios Salvos
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-lg bg-red-700 text-white font-medium hover:bg-red-800 shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Relatório
                </button>
            </div>

        </form>

    </div>

    <script>
        const anos = [6, 7, 8, 9, 10, 11, 12];

        function obterChaveStorage(unidade) {
            return 'maple_report_' + unidade.trim().toLowerCase().replace(/\s+/g, '_');
        }

        function salvarRelatorio() {
            const unidade = document.getElementById('nome-unidade').value.trim();
            const dataRelatorio = document.getElementById('data-relatorio').value;

            if (!unidade) {
                alert('Por favor, informe o Nome da Unidade antes de salvar.');
                return;
            }

            const dadosRelatorio = {
                unidade: unidade,
                data: dataRelatorio,
                anos: {}
            };

            anos.forEach(ano => {
                dadosRelatorio.anos[ano] = {
                    observacoes: document.getElementById(`obs-year${ano}`).value,
                    evidencias: document.getElementById(`ev-year${ano}`).value
                };
            });

            const chave = obterChaveStorage(unidade);
            localStorage.setItem(chave, JSON.stringify(dadosRelatorio));
            alert(`Relatório da unidade "${unidade}" salvo com sucesso na base de dados!`);
        }

        function carregarRelatorioPorUnidade() {
            const unidade = document.getElementById('nome-unidade').value.trim();
            if (!unidade) return;

            const chave = obterChaveStorage(unidade);
            const dadosSalvos = localStorage.getItem(chave);

            if (dadosSalvos) {
                const dados = JSON.parse(dadosSalvos);
                document.getElementById('data-relatorio').value = dados.data || '';

                anos.forEach(ano => {
                    if (dados.anos && dados.anos[ano]) {
                        document.getElementById(`obs-year${ano}`).value = dados.anos[ano].observacoes || '';
                        document.getElementById(`ev-year${ano}`).value = dados.anos[ano].evidencias || '';
                    }
                });
            } else {
                document.getElementById('data-relatorio').value = '';
                anos.forEach(ano => {
                    document.getElementById(`obs-year${ano}`).value = '';
                    document.getElementById(`ev-year${ano}`).value = '';
                });
            }
        }
    </script>

</body>
</html>
